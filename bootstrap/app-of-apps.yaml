---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qserv
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/lsst/qserv-deployments.git
    targetRevision: main
    path: deployments
    directory:
      recurse: true
      include: "application.yaml"
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
